<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="buzz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#F7931E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="120" fill="url(#buzz-bg)"/>
  <!-- Relay tower / radio wave motif -->
  <g transform="translate(400,420)">
    <!-- Center tower -->
    <rect x="-25" y="-160" width="50" height="280" rx="10" fill="#FFFFFF"/>
    <!-- Top antenna -->
    <circle cx="0" cy="-180" r="20" fill="#FFFFFF"/>
    <!-- Left arcs -->
    <path d="M-80,-100 A160,160 0 0,0 -80,80" stroke="#FFFFFF" stroke-width="30" fill="none" opacity="0.5"/>
    <path d="M-140,-60 A220,220 0 0,0 -140,20" stroke="#FFFFFF" stroke-width="30" fill="none" opacity="0.3"/>
    <!-- Right arcs -->
    <path d="M80,-100 A160,160 0 0,1 80,80" stroke="#FFFFFF" stroke-width="30" fill="none" opacity="0.5"/>
    <path d="M140,-60 A220,220 0 0,1 140,20" stroke="#FFFFFF" stroke-width="30" fill="none" opacity="0.3"/>
    <!-- Base -->
    <rect x="-90" y="120" width="180" height="40" rx="8" fill="#FFFFFF"/>
  </g>
</svg>